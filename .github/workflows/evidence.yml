name: a rule change carries its cases

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: a change to what a rule says must change the cases with it
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF...HEAD"
          else
            range="$BEFORE..HEAD"
          fi
          if ! git rev-parse --verify --quiet "${range%%.*}^{commit}" >/dev/null; then
            echo "no commit to compare against ($range), so nothing was checked."
            echo "This check reads a diff; it cannot read one that does not exist."
            exit 0
          fi

          said=$(git diff -U0 "$range" -- 'src/law/**' \
                 | grep -E '^[+-][^+-]' \
                 | grep -E 'bans:|instead:|id: "' || true)
          rust=$(git diff -U0 "$range" -- 'vendor/rust-law/src/**' \
                 | grep -E '^[+-][^+-]' \
                 | grep -E 'Rule::|fn judge|violations\.push|help_for|bans' || true)
          cases=$(git diff --name-only "$range" \
                  | grep -E '^audit/(cases|rust-cases)\.ts$' || true)

          if { [ -n "$said" ] || [ -n "$rust" ]; } && [ -z "$cases" ]; then
            echo "This changes what a rule says:"
            echo "$said$rust" | sed 's/^/  /' | head -20
            echo
            echo "and neither audit/cases.ts nor audit/rust-cases.ts moved with it."
            echo "A rule's cases are written first,"
            echo "from its own ban text: what must fire and what must stay silent."
            echo "A test written after the code can only agree with the code."
            echo
            echo "CONTRIBUTING.md, 'Changing a rule, or adding one', has the order."
            exit 1
          fi
          echo "no rule text changed, or the cases changed with it"
